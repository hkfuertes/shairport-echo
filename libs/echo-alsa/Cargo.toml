[package]
name = "echo-alsa"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Raw ALSA Echo hardware library for ARMv7 Echo devices"

[lib]
crate-type = ["rlib", "staticlib"]

[[example]]
name = "pcm_probe"
required-features = ["shairplay"]

[features]
default = []
shairplay = ["dep:shairplay"]

[dependencies]
libc = "0.2"
shairplay = { version = "=0.10.0", default-features = false, features = ["resample"], optional = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
