[package]
name = "shairplay-echo-alsa"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Raw ALSA Echo hardware sink for shairplay PCM callbacks"

[dependencies]
libc = "0.2"
shairplay = { version = "=0.10.0", default-features = false, features = ["resample"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
