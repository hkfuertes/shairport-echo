// A/B configuration for the reusable Echo raw-ALSA crate backend.
general =
{
  name = "Echo Shairport";
  service_type = "airplay2";
  output_backend = "echo";
  mdns_backend = "tinysvcmdns";
  interface = "wlan0";
  port = 7000;
  playback_mode = "mono";
  // Keep normal AirPlay slider positions audible on the Echo's hardware mixer.
  volume_range_db = 30;
  // Keep AirPlay, ALSA and the 12-segment LED bar on one linear scale.
  volume_control_profile = "flat";
  // The crate starts after three 1,024-frame periods at 48 kHz.
  audio_backend_buffer_desired_length_in_seconds = 0.064;
  audio_backend_buffer_interpolation_threshold_in_seconds = 0.015;
};
