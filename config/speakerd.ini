# Seeded once to /data/speakerd.ini by the installer; that copy is authoritative.
# speakerd is the Android ledcontroller service. NQPTP always runs; AirPlay is the only mode.

default = airplay

[services]
# Restore entropy and prepare networking before NQPTP starts.
nqptp = sh -c 'R=/system/lib/shairport-echo; "$R/entropy-seed" /data/shairport-echo.seed || true; while ! ip -4 addr show dev wlan0 2>/dev/null | grep -q "inet "; do sleep 1; done; mac=$(tr -cd "[:xdigit:]" </sys/class/net/wlan0/address); [ "${#mac}" -eq 12 ] || exit 1; hostname "shairport-$mac" || exit 1; if [ -e /dev/shm ]; then [ -d /dev/shm ] || exit 1; else mkdir /dev/shm && mount -t tmpfs -o mode=1777,size=1m tmpfs /dev/shm || exit 1; fi; exec "$R/nqptp"'

[airplay]
color = ffffff
volume_buttons = false
metadata_port = 45678
privacy_mute = true
# Wait for NQPTP's PTP port so Shairport cannot race it at boot.
init = sh -c 'while ! netstat -ln 2>/dev/null | grep -q ":319"; do sleep 1; done; sleep 1; exec env ALSA_CONFIG_PATH=/system/lib/shairport-echo/echo-alsa.conf /system/lib/shairport-echo/shairport-sync -c /data/shairport-sync.conf'
