// Legacy diagnostic configuration: PTP remains active, but this disables
// Shairport's local ALSA delay correction to isolate audible wow/flutter.
general =
{
  name = "Echo Shairport";
  service_type = "airplay2";
  output_backend = "alsa";
  mdns_backend = "tinysvcmdns";
  interface = "wlan0";
  port = 7000;
  playback_mode = "mono";
  audio_backend_buffer_desired_length_in_seconds = 0.03;
  audio_backend_buffer_interpolation_threshold_in_seconds = 0.015;
};

alsa =
{
  output_device = "echo";
  output_rate = 48000;
  output_format = "S16_LE";
  output_channels = 2;
  period_size = 1024;
  buffer_size = 4096;
  use_mmap_if_available = "no";
  disable_synchronization = "yes";
};
