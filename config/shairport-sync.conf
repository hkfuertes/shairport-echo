// Seeded once to /data/shairport-sync.conf by ledcontroller; that copy is
// authoritative. The name placeholder becomes ro.product.name. Any shairport-sync option can be added.
general =
{
  name = "@NAME@";
  // Sender icon: "AudioAccessory5,1" HomePod mini, "AudioAccessory1,1" HomePod,
  // "AirPort10,115" AirPort Express. Default is "ShairportSync".
  // model = "AirPort10,115";
  service_type = "airplay2";
  output_backend = "echo";
  mdns_backend = "tinysvcmdns";
  interface = "wlan0";
  port = 7000;
  playback_mode = "mono";
  volume_range_db = 30;
  volume_control_profile = "flat";
  audio_backend_buffer_desired_length_in_seconds = 0.064;
  audio_backend_buffer_interpolation_threshold_in_seconds = 0.015;
};

// Local UDP metadata keeps echo-volume-control independent of Shairport's process.
metadata = {
  socket_address = "127.0.0.1";
  socket_port = 45678;
  include_cover_art = "no";
};
